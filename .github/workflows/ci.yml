name: CPU verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --omit=optional
      - run: npm run check
      - run: npm test
      - run: npm run demo
      - run: npm run evaluate
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-challenge-${{ matrix.os }}
          path: evaluation-results/challenge.json
  encoder-bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --omit=optional
      - run: python -m pip install numpy
      - run: python scripts/evaluate_mteb.py --smoke
  submission:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/verify_submission.py
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libreoffice-impress libreoffice-writer poppler-utils
      - run: mkdir rendered && libreoffice -env:UserInstallation=file:///tmp/codestrata-lo --headless --convert-to pdf --outdir rendered docs/CodeStrata-Submission-Draft.pptx
      - run: test "$(pdfinfo rendered/CodeStrata-Submission-Draft.pdf | awk '/Pages:/ {print $2}')" = 12
      - run: pdftoppm -scale-to 1400 -png rendered/CodeStrata-Submission-Draft.pdf rendered/slide
      - run: libreoffice -env:UserInstallation=file:///tmp/codestrata-lo --headless --convert-to pdf --outdir rendered docs/CodeStrata-AI-Disclosure-Draft.docx
      - run: test "$(pdfinfo rendered/CodeStrata-AI-Disclosure-Draft.pdf | awk '/Pages:/ {print $2}')" -ge 1
      - run: pdftoppm -scale-to 1400 -png rendered/CodeStrata-AI-Disclosure-Draft.pdf rendered/disclosure
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: submission-render
          path: rendered/
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --omit=optional
      - run: npx playwright install --with-deps chromium firefox
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-verification
          path: |
            playwright-report/
            test-results/
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: docker build -t codestrata:test .
      - run: docker run -d --name codestrata -p 127.0.0.1:3000:3000 codestrata:test
      - run: node scripts/http-smoke.js
      - run: docker logs codestrata
        if: always()
      - run: docker rm -f codestrata
        if: always()
