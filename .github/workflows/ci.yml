name: CPU verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --omit=optional
      - run: npm run check
      - run: npm test
      - run: npm run demo
      - run: npm run evaluate
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-challenge-${{ matrix.os }}
          path: evaluation-results/challenge.json
  encoder-bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --omit=optional
      - run: python -m pip install numpy
      - run: python scripts/evaluate_mteb.py --smoke
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --omit=optional
      - run: npx playwright install --with-deps chromium firefox
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-verification
          path: |
            playwright-report/
            test-results/
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: docker build -t codestrata:test .
      - run: docker run -d --name codestrata -p 127.0.0.1:3000:3000 codestrata:test
      - run: node scripts/http-smoke.js
      - run: docker logs codestrata
        if: always()
      - run: docker rm -f codestrata
        if: always()
